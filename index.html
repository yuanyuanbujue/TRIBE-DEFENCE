/* =========================
   BASIC PAGE SETTINGS
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #111, #1b1b1b, #222);
    color: white;
    text-align: center;
}


/* =========================
   HEADER
========================= */

header {
    padding: 60px 20px;
    background: linear-gradient(180deg, #2c2c2c, #181818);
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
}

header h1 {
    color: gold;
    font-size: 60px;
    letter-spacing: 3px;
}

header p {
    margin-top: 10px;
    font-size: 20px;
    color: #d6d6d6;
}


/* =========================
   MAIN SECTION
========================= */

section {
    width: 80%;
    max-width: 900px;
    margin: 50px auto;
    background: #2a2a2a;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
}

h2 {
    color: gold;
    margin-bottom: 20px;
}

section p {
    font-size: 18px;
    line-height: 1.6;
    color: #dddddd;
}


/* =========================
   BUTTON AREA
========================= */

.buttons {
    margin-top: 40px;
}

========================= */

    background: black;

    border: 3px solid #FF000094FFF9;
    padding: 15px 35px;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
    margin: 15px;
    transition: 0.3s;
}

.baseBtn:hover {
    background: #00ff66;
    color: black;
    box-shadow: 0 0 20px #00ff66;
    transform: translateY(-4px);
}

}

.credit-options.open {

}

.credit-options button {

<!-- =========================
     HEADER
========================= -->

<header>

</header>


<!-- =========================

========================= -->

    </p>


    <!-- =========================

    ========================= -->

    <div class="buttons">

        <button class="baseBtn"
        onclick="location.href='base-siege.html'">

        </button>


        <button class="tribeBtn"

        </button>


        <button class="buckshotBtn"

        </button>

        onclick="location.href='out-break.html'">
            Out Break
        </button>

            1v1 Showdown
        </button>


        <button class="cartBtn"
        onclick="location.href='cartridge.html'">
            Cartridge
        </button>


        <button class="gemhunterBtn"
        onclick="location.href='gem-hunter.html'">
            Gem Hunter (PRE-RELEASE)
        </button>


        <button class="voltexBtn"
        onclick="location.href='voltex-choice.html'">
            Voltex (Incomplete)

<!-- =========================
     TOP RIGHT CREDITS MENU
========================= -->

<div class="credit-menu">
    <button class="credit-toggle" id="creditToggle">Credits &#9662;</button>
    <div class="credit-options" id="creditOptions">
        <button onclick="location.href='yuan-credits.html'">Yuan's Credits</button>
        <button onclick="location.href='edric-credits.html'">Edric's Credits</button>
    </div>
</div>

<script>
    const creditToggle = document.getElementById('creditToggle');
    const creditOptions = document.getElementById('creditOptions');

    creditToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        creditOptions.classList.toggle('open');
    });

    document.addEventListener('click', function () {
        creditOptions.classList.remove('open');
    });
</script>
