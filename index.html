<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#111,#1b1b1b,#222);
    color:white;
    text-align:center;
}

/* Header */

header{
    padding:60px 20px;
    background:linear-gradient(180deg,#2c2c2c,#181818);
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

header h1{
    color:gold;
    font-size:60px;
    letter-spacing:3px;
}

header p{
    margin-top:10px;
    font-size:20px;
    color:#d6d6d6;
}

/* Main Card */

section{
    width:80%;
    max-width:900px;
    margin:50px auto;
    background:#2a2a2a;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

h2{
    color:gold;
    margin-bottom:20px;
}

section p{
    font-size:18px;
    line-height:1.6;
    color:#dddddd;
}

/* Buttons */

.buttons{
    margin-top:40px;
}

/* Base Siege */

.baseBtn{
    background:black;
    color:#00ff66;
    border:3px solid #00ff66;
    padding:15px 35px;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
    margin:15px;
    transition:.3s;
}

.baseBtn:hover{
    background:#00ff66;
    color:black;
    box-shadow:0 0 20px #00ff66;
    transform:translateY(-4px);
}
