<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edric's Credits - Fortressed</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #111, #1b1b1b, #222);
    color: white;
    text-align: center;
    min-height: 100vh;
}
header {
    padding: 50px 20px;
    background: linear-gradient(180deg, #2c2c2c, #181818);
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}
header h1 { color: #4da6ff; font-size: 48px; letter-spacing: 2px; }
header p { margin-top: 10px; color: #d6d6d6; font-size: 18px; }
section {
    width: 80%; max-width: 700px; margin: 40px auto;
    background: #2a2a2a; padding: 35px; border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}
h2 { color: #4da6ff; margin-bottom: 20px; }
ul { list-style: none; }
li { font-size: 18px; padding: 8px 0; color: #ddd; }
section p { font-size: 17px; line-height: 1.6; color: #ccc; }
.back {
    display: inline-block; margin: 10px 0 40px;
    background: black; color: #4da6ff; border: 3px solid #4da6ff;
    padding: 12px 30px; font-size: 17px; border-radius: 10px;
    cursor: pointer; transition: 0.3s;
}
.back:hover { background: #4da6ff; color: black; box-shadow: 0 0 20px #4da6ff; }
</style>
</head>
<body>
<header>
    <h1>EDRIC</h1>
    <p>Credits</p>
</header>
<section>
    <h2>Games Created</h2>
    <ul>
        <li>Tribe Defence</li>

    </ul>
</section>
<section>
    <h2>Special Thanks</h2>
    <p>Edric designed the new game buttons on the main page.</p>
</section>
<button class="back" onclick="location.href='index.html'">&larr; Back to Fortressed</button>
</body>
</html>
